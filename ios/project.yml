name: "Finder"
options:
  bundleIdPrefix: dev.damsac
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  "Finder":
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Bindings
        excludes:
          - "*.h"
          - "*.modulemap"
    dependencies:
      - framework: "Frameworks/finder_ffi.xcframework"
        embed: false
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        ENABLE_TESTABILITY: YES
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Finder"
        UILaunchScreen: {}
        NSCameraUsageDescription: "Finder uses the camera to scan for objects you describe."
  "FinderTests":
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: "Finder"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Finder.app/Finder"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: "Finder"
  "FinderUITests":
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: "Finder"

schemes:
  Finder:
    build:
      targets:
        Finder: all
    test:
      targets:
        - name: FinderTests
          randomExecutionOrder: true
        - name: FinderUITests
          randomExecutionOrder: true
